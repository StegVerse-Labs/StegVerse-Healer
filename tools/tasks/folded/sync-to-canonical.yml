name: Canonical Sync Legacy Boundary

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on broad canonical overwrite request
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${HEALER_GH_TOKEN:-}"
          echo "STATE=BLOCKED"
          echo "The former broad StegDB bundle download/copy/push/PR sync is retired."
          echo "Release condition: StegDB publishes a Healer-specific hash-pinned candidate and TVC admits an exact bounded local import scope."
          echo "Canonical task: data/session_consolidation/stegdb-healer-canonical-import.json"
          echo "GitHub token production authority: NONE"
          exit 3
