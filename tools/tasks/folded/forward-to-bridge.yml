name: AI Bridge Forwarding Legacy Boundary

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Record retired forwarding path
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GH_STEGVERSE_AI_TOKEN:-}"
          echo "STATE=SUPERSEDED"
          echo "GitHub repository_dispatch forwarding has been retired."
          echo "Any future AI-review bridge must be admitted as a TV/TVC-governed sovereign local handler or distinct bounded transport."
          echo "GitHub token production authority: NONE"
