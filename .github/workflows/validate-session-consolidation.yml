name: Validate Session Consolidation

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "data/session_consolidation/**"
      - "schemas/session_execution_inventory.schema.json"
      - "scripts/validate_session_execution_inventory.py"
      - "docs/HEALER_MIRROR_HANDOFF.md"

permissions:
  contents: read

concurrency:
  group: validate-session-consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Standard library only: the runner's preinstalled python3 is the interpreter (no setup-python).
      - name: Validate JSON syntax
        run: |
          python3 -m json.tool schemas/session_execution_inventory.schema.json >/dev/null
          python3 -m json.tool data/session_consolidation/single_scheduler_session_inventory.json >/dev/null
      - name: Validate execution inventory contract
        run: python3 scripts/validate_session_execution_inventory.py
      - name: Upload canonical consolidation record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: single-scheduler-session-consolidation-${{ github.run_id }}
          path: |
            data/session_consolidation/single_scheduler_session_inventory.json
            schemas/session_execution_inventory.schema.json
          if-no-files-found: error
          retention-days: 90
