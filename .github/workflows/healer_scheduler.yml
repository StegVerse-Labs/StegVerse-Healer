name: Healer Scheduler (Single Clock)

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 (stagger to avoid top-of-hour load)
  workflow_dispatch:
    inputs:
      run_scope:
        description: "all | site | scw | tv | cosden | continuity"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: healer-scheduler
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream orchestrators
        env:
          GH_TOKEN: ${{ secrets.HEALER_GH_TOKEN }}
          SCOPE: ${{ github.event.inputs.run_scope || 'all' }}
        run: |
          set -euo pipefail

          trigger () {
            local repo="$1"
            local workflow_file="$2"
            local ref="${3:-main}"

            echo "Triggering ${repo} -> ${workflow_file} (ref=${ref})"

            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/actions/workflows/${workflow_file}/dispatches" \
              -d "{\"ref\":\"${ref}\",\"inputs\":{\"master_override\":\"false\"}}"

            echo "OK: ${repo}"
          }

          # ---- Edit these to match your repo names + branches ----
          if [ "$SCOPE" = "all" ] || [ "$SCOPE" = "site" ]; then
            trigger "StegVerse-Labs/Site" "ingestion-orchestrator.yml" "main"
          fi

          if [ "$SCOPE" = "all" ] || [ "$SCOPE" = "scw" ]; then
            trigger "StegVerse-Labs/SCW" "ingestion-orchestrator.yml" "main"
          fi

          if [ "$SCOPE" = "all" ] || [ "$SCOPE" = "tv" ]; then
            trigger "StegVerse-Labs/TV" "ingestion-orchestrator.yml" "main"
          fi

          if [ "$SCOPE" = "all" ] || [ "$SCOPE" = "cosden" ]; then
            trigger "StegVerse-Labs/CosDen" "ingestion-orchestrator.yml" "main"
          fi

          if [ "$SCOPE" = "all" ] || [ "$SCOPE" = "continuity" ]; then
            trigger "StegVerse-Labs/Continuity" "ingestion-orchestrator.yml" "main"
          fi
