name: Healer Scheduler (Single Clock)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      run_scope:
        description: "all or a configured repository/workflow alias"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: healer-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate scheduler configuration
        run: |
          python -m json.tool data/orchestrator_targets.json >/dev/null
          python -m py_compile app/dispatch_orchestrators.py

      - name: Dispatch downstream orchestrators
        env:
          HEALER_GH_TOKEN: ${{ secrets.HEALER_GH_TOKEN }}
          RUN_SCOPE: ${{ github.event.inputs.run_scope || 'all' }}
          DISPATCH_MODE: ${{ github.event_name }}
          TARGETS_FILE: data/orchestrator_targets.json
        run: python app/dispatch_orchestrators.py
