name: Healer Scheduler Contract Validation

on:
  workflow_dispatch:
    inputs:
      run_scope:
        description: "Optional configured repository/workflow alias for contract validation"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: healer-scheduler-contract-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate scheduler source
        run: |
          python -m json.tool data/orchestrator_targets.json >/dev/null
          python -m py_compile app/dispatch_orchestrators.py app/sovereign_scheduler.py

      - name: Assert production credential variables are absent
        shell: bash
        run: |
          set -euo pipefail
          test -z "${HEALER_GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${HEALER_PAT:-}"
          test -z "${GH_STEGVERSE_AI_TOKEN:-}"

      - name: Validate fail-closed behavior without sovereign repository roots
        env:
          RUN_SCOPE: ${{ github.event.inputs.run_scope || 'all' }}
          DISPATCH_MODE: manual
          TARGETS_FILE: data/orchestrator_targets.json
        run: |
          set +e
          output="$(python app/dispatch_orchestrators.py)"
          rc=$?
          set -e
          echo "$output"
          test "$rc" -ne 0
          python - "$output" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          assert payload['state'] == 'FAILED'
          assert payload['credential_authority'] == 'TV/TVC'
          assert payload['github_token_required'] is False
          assert 'STEGVERSE_REPO_ROOTS_JSON' in payload['error']
          print('HEALER_SOVEREIGN_SCHEDULER_FAIL_CLOSED=PASS')
          PY

      - name: Record authority boundary
        if: always()
        run: |
          echo "## Healer scheduler contract" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted schedule: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted production dispatch: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub token production authority: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "Credential/admission authority: TV/TVC" >> "$GITHUB_STEP_SUMMARY"
          echo "Production scheduler/execution carrier: single StegVerse resident heartbeat" >> "$GITHUB_STEP_SUMMARY"
