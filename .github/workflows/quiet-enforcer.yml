name: Quiet Enforcer Legacy Redirect

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Record canonical successor
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${HEALER_GH_TOKEN:-}"
          echo "STATE=SUPERSEDED"
          echo "Canonical validation surface: .github/workflows/quiet_enforcer.yml"
          echo "Canonical production implementation: app/audit_schedules.py"
          echo "Production carrier: single StegVerse resident heartbeat via app/sovereign_scheduler.py"
          echo "GitHub token production authority: NONE"
