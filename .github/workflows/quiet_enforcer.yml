name: Quiet Enforcer Contract Validation

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: healer-quiet-enforcer-contract-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anonymous public checkout without GitHub token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/StegVerse-Healer.git
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Validate local audit implementation
        run: |
          python -m json.tool data/orchestrator_targets.json >/dev/null
          python -m py_compile app/audit_schedules.py

      - name: Assert GitHub credential variables are absent
        run: |
          set -euo pipefail
          test -z "${HEALER_GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${HEALER_PAT:-}"
          test -z "${GH_STEGVERSE_AI_TOKEN:-}"

      - name: Validate fail-closed local-root requirement
        env:
          TARGETS_FILE: data/orchestrator_targets.json
          QUIET_RECEIPT: /tmp/quiet_enforcer_latest.json
        run: |
          set +e
          python app/audit_schedules.py >/tmp/quiet.out 2>/tmp/quiet.err
          rc=$?
          set -e
          cat /tmp/quiet.err
          test "$rc" -ne 0
          grep -q "STEGVERSE_REPO_ROOTS_JSON is required" /tmp/quiet.err
          echo HEALER_QUIET_ENFORCER_FAIL_CLOSED=PASS

      - name: Record authority boundary
        if: always()
        run: |
          echo "## Quiet Enforcer contract" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted schedule: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub API audit: RETIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub token production authority: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "Production audit source: locally materialized repositories" >> "$GITHUB_STEP_SUMMARY"
          echo "Production carrier: single StegVerse resident heartbeat" >> "$GITHUB_STEP_SUMMARY"
