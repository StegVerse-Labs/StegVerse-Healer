name: StegDeploy Publication Relay Contract Validation

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: stegdeploy-publication-relay-contract-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anonymous public checkout without GitHub token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/StegVerse-Healer.git
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Compile sovereign relay
        run: python -m py_compile app/relay_stegdeploy_publication.py

      - name: Assert GitHub credential variables are absent
        run: |
          set -euo pipefail
          test -z "${HEALER_GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${HEALER_PAT:-}"
          test -z "${GH_STEGVERSE_AI_TOKEN:-}"

      - name: Validate fail-closed local-root requirement
        run: |
          set +e
          output="$(python app/relay_stegdeploy_publication.py 2>&1)"
          rc=$?
          set -e
          echo "$output"
          test "$rc" -ne 0
          echo "$output" | grep -q 'STEGVERSE_REPO_ROOTS_JSON is required'
          echo HEALER_STEGDEPLOY_LOCAL_RELAY_FAIL_CLOSED=PASS

      - name: Record authority boundary
        if: always()
        run: |
          echo "## StegDeploy sovereign relay contract" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted schedule: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub API/repository_dispatch production role: RETIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub token production authority: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: locally materialized LLM-adapter publication receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: locally materialized core-node sovereign intake" >> "$GITHUB_STEP_SUMMARY"
          echo "Production carrier: single StegVerse resident heartbeat" >> "$GITHUB_STEP_SUMMARY"
