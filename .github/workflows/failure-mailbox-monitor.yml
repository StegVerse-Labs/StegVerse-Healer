name: Healer Failure Mailbox Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/failure-mailbox-monitor.yml'

# Healer never receives mailbox credential values. GitHub may physically store
# the Graph configuration for now, but TV/TVC owns credential processing.
permissions:
  contents: read
  actions: read

concurrency:
  group: healer-failure-mailbox-monitor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tvc_observe:
    uses: StegVerse-Labs/TVC/.github/workflows/mailbox-failure-observation-reusable.yml@4fd185494edf4e47edbf913cd227851e11ff2418
    with:
      window_minutes: 20
      lag_minutes: 2
      maximum_messages: 1000

  diagnose:
    needs: tvc_observe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Healer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore durable Healer diagnostic state
        uses: actions/cache/restore@v4
        with:
          path: status/failure-mailbox
          key: healer-failure-mailbox-state-${{ github.run_id }}
          restore-keys: |
            healer-failure-mailbox-state-

      - name: Download TVC-sanitized mailbox observation
        uses: actions/download-artifact@v4
        with:
          name: tvc-mailbox-failure-observation
          path: status/failure-mailbox/tvc-observation

      - name: Bind TVC observation to Healer intake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status/failure-mailbox
          cp status/failure-mailbox/tvc-observation/batch.jsonl status/failure-mailbox/current-batch.jsonl
          cp status/failure-mailbox/tvc-observation/manifest.json status/failure-mailbox/current-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('status/failure-mailbox/current-manifest.json').read_text())
          assert m['credential_authority'] == 'TV/TVC'
          assert m['credential_processed_by'] == 'StegVerse-Labs/TVC'
          assert m['credential_value_exposed'] is False
          assert m['credential_value_persisted'] is False
          assert m['consumer_credential_exported'] is False
          assert m['mailbox_mutated'] is False
          assert m['provider_message_ids_exported'] is False
          assert m['partial_materialization'] is False
          PY

      - name: Run deterministic failure-mailbox tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_failure_mailbox*.py'

      - name: Run Healer shadow diagnostics
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          eval "$(python - <<'PY'
          import json, shlex
          m=json.load(open('status/failure-mailbox/current-manifest.json'))
          values={
            'BATCH_ID':m['batch_id'],
            'SOURCE_COUNT':str(m['source_count']),
            'WINDOW_START':m['window_start'],
            'WINDOW_END':m['window_end'],
            'SOURCE_REF':m['source_ref'],
          }
          for k,v in values.items():
            print(f'{k}={shlex.quote(v)}')
          PY
          )"
          python -m failure_mailbox.shadow \
            --input status/failure-mailbox/current-batch.jsonl \
            --ledger status/failure-mailbox/incident-ledger.json \
            --state status/failure-mailbox/shadow-state.json \
            --report status/failure-mailbox/latest-report.json \
            --batch-id "$BATCH_ID" \
            --source-count "$SOURCE_COUNT" \
            --window-start "$WINDOW_START" \
            --window-end "$WINDOW_END" \
            --source-ref "$SOURCE_REF"

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          echo "## Healer failure mailbox diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "Credential processing: StegVerse-Labs/TVC only" >> "$GITHUB_STEP_SUMMARY"
          echo "Mailbox mutation: disabled" >> "$GITHUB_STEP_SUMMARY"
          for file in current-manifest.json latest-report.json; do
            path="status/failure-mailbox/$file"
            if [ -f "$path" ]; then
              echo "### $file" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$path" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Save durable Healer diagnostic state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: status/failure-mailbox
          key: healer-failure-mailbox-state-${{ github.run_id }}

      - name: Stage durable monitor state
        if: always()
        shell: bash
        run: |
          mkdir -p monitor-state/failure-mailbox
          if [ -d status/failure-mailbox ]; then
            cp -R status/failure-mailbox/. monitor-state/failure-mailbox/
          fi

      - name: Upload durable monitor state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-mailbox-monitor-state
          path: monitor-state
          retention-days: 90
          if-no-files-found: error
