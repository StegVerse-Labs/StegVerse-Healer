name: SuperCheck Core Legacy Boundary

on:
  workflow_call:
    inputs:
      paths:
        required: false
        type: string
        default: ""
      direct_commit:
        required: false
        type: boolean
        default: false
  workflow_dispatch: {}

permissions: {}

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on legacy hosted mutation request
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${HEALER_PAT:-}"
          test -z "${HEALER_GH_TOKEN:-}"
          echo "STATE=SUPERSEDED"
          echo "PAT/GitHub-push/PR repair authority has been retired."
          echo "Canonical bounded repair example: StegVerse-Labs/TV/scripts/sovereign_self_heal.py"
          echo "Admission authority: StegVerse-Labs/TVC execution-grant policy"
          echo "Production carrier: single StegVerse resident heartbeat"
          echo "GitHub token production authority: NONE"
          exit 3
