name: Test Readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  repo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse credential-bearing environment
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT HEALER_GH_TOKEN HEALER_PAT GH_STEGVERSE_AI_TOKEN STEGVERSE_CROSS_REPO_READ_TOKEN MARKETPLACE_COINBASE_EVIDENCE_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'HEALER_VALIDATION_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'HEALER_VALIDATION_GITHUB_TOKEN_AUTHORITY=NONE'
      - name: Fetch exact Healer source anonymously
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=50 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
      - name: Verify preinstalled Python
        run: |
          python3 --version
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print('HEALER_VALIDATION_PYTHON=PASS')
          PY
      - name: Baseline repository smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import sys

          root = Path('.')
          failures = []

          if not any((root / name).exists() for name in ('README.md', 'README.MD')):
              failures.append('missing README.md')

          workflows = root / '.github' / 'workflows'
          if workflows.exists():
              bad = sorted(p.name for p in workflows.glob('*.ym'))
              if bad:
                  failures.append('workflow files must end in .yml or .yaml: ' + ', '.join(bad))

          for path in sorted(root.rglob('*.json')):
              if any(part in {'.git', 'node_modules', '.venv', 'venv'} for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'invalid JSON: {path}: {exc}')

          if failures:
              print('TEST READINESS FAILED')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)

          print('TEST READINESS PASSED')
          PY
      - name: Run deterministic Healer tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run failure mailbox product benchmark
        run: |
          python3 failure_mailbox/benchmark.py | tee /tmp/failure-mailbox-benchmark.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/failure-mailbox-benchmark.json').read_text(encoding='utf-8'))
          assert report['result'] == 'PASS', report
          assert report['packaging_gate']['package_release_allowed'] is False
          print('FAILURE_MAILBOX_BENCHMARK=PASS')
          print('FAILURE_MAILBOX_PACKAGE_GATE=HISTORICAL_AND_LIVE_BENCHMARKS_REQUIRED')
          PY
      - name: Confirm validation-only authority boundary
        run: |
          echo 'HEALER_VALIDATION_ONLY=TRUE'
          echo 'HEALER_RUNTIME_EXECUTION_AUTHORITY=NONE'
          echo 'HEALER_GITHUB_TOKEN_AUTHORITY=NONE'
